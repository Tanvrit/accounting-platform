[versions]
# ─────────────────────────────────────────────────────────────────────────────
# Tanvrit pins (split, deliberately — core and sdk publish from different repos)
#
# Verified before pinning (2026-09-25), per the monorepo rule "verify the bytes
# for the target that ships, not the status code":
#   core / core-accounting / accounting / ui / auth / business / storage at 3.0.7
#   all resolve root POM from https://maven.tanvrit.com (HTTP 200), and
#   accounting-wasm-js-3.0.7.klib was fetched whole and confirmed to carry the
#   com.tanvrit.accounting.{network,handler,viewmodel} packages
#   (AccountingBudgetNetwork, ReconciliationNetwork, …).
#
# NOTE: the SDK module line does NOT exist at 3.0.5 — core 3.0.5 was published
# in Phase 1/2 (MASTER_PLAN) but every SDK module (accounting/ui/auth/business/
# storage) is 404 at 3.0.5 and first resolves at 3.0.6. 3.0.7 is the current
# verified line and matches what platforms/ai consumes (its catalog comment
# records 108/108 HTTP 200 across all target variants for 3.0.7).
# SDK 3.0.6+ is a Kotlin 2.4.20 / Compose Multiplatform 1.12.1 / AGP 9.4.1
# build; the kotlin / compose-multiplatform / agp pins below move WITH the
# tanvrit pin, never one side first (an SDK klib compiled against Compose
# 1.12.1 linked into an app on 1.11.x builds green and dies at boot with
# IrLinkageError).
tanvrit = "3.0.7"
# core ONLY — published from the separate core/ repo, keeps its own ref so it
# may run ahead of `tanvrit`. Do not collapse the two refs; the split pin is
# load-bearing (see docs/decisions, "core and sdk version independently").
tanvrit-core = "3.0.7"

# Toolchain (tracks the SDK's build toolchain — see the block above).
kotlin = "2.4.20"
compose-multiplatform = "1.12.1"
# JetBrains material3 does not ship on the CMP version line; 1.12.0-alpha03 is
# the release the CMP 1.12.1 notes pair with it.
compose-material3 = "1.12.0-alpha03"
# material-icons-* froze at 1.7.3 upstream; not on the CMP version line.
compose-material-icons = "1.7.3"
agp = "9.4.1"

# Libraries
ktor = "3.5.2"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
koin = "4.2.2"
androidx-activity-compose = "1.13.0"
androidx-lifecycle = "2.11.0"
# navigation-compose 2.10.0-beta01 is what CMP 1.12.1 ships with; the default
# NavHost enter/exit transitions on web/desktop are None on this line, so
# destinations are declared with tanvritComposable<> (explicit motion).
androidx-navigation = "2.10.0-beta01"

[libraries]
# Compose Multiplatform — one version key for all org.jetbrains.compose.* (the
# plugin's compose.* accessors are deprecated in 1.12).
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
# material3 asks for material-ripple 1.12.0-beta01; nothing else lifts it on
# wasmJs/iOS, so it is pinned to the Compose version to keep one skiko.
compose-material-ripple = { module = "org.jetbrains.compose.material:material-ripple", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "compose-material-icons" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }

# Tanvrit core (core/ repo — split pin above)
tanvrit-core = { module = "com.tanvrit:core", version.ref = "tanvrit-core" }
# core-accounting carries the accounting models + wire DTOs
# (com.tanvrit.core.feature.accounting.*). Also `api()`-re-exported by
# com.tanvrit:accounting; declared explicitly so the pin survives a future
# sdk-side encapsulation change.
tanvrit-core-accounting = { module = "com.tanvrit:core-accounting", version.ref = "tanvrit-core" }

# Tanvrit SDK (sdk/ repo)
tanvrit-accounting = { module = "com.tanvrit:accounting", version.ref = "tanvrit" }
tanvrit-storage = { module = "com.tanvrit:storage", version.ref = "tanvrit" }
tanvrit-auth = { module = "com.tanvrit:auth", version.ref = "tanvrit" }
tanvrit-business = { module = "com.tanvrit:business", version.ref = "tanvrit" }
tanvrit-ui = { module = "com.tanvrit:ui", version.ref = "tanvrit" }

# Kotlin
kotlin-stdlib-wasm-js = { module = "org.jetbrains.kotlin:kotlin-stdlib-wasm-js", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Ktor client (the engine of TanvritClient is provided per-target by core; the
# client core is declared transitively through com.tanvrit:core but kept here
# for tests that want a MockEngine).
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# DI
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# androidx
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
# Explicit transitive companions — navigation-compose declares these as
# metadataApiElements deps whose resolution onto the commonMain metadata
# classpath is unreliable; without them compileCommonMainKotlinMetadata cannot
# resolve androidx.navigation.{NavHostController, NavBackStackEntry, ...}.
androidx-navigation-common = { module = "org.jetbrains.androidx.navigation:navigation-common", version.ref = "androidx-navigation" }
androidx-navigation-runtime = { module = "org.jetbrains.androidx.navigation:navigation-runtime", version.ref = "androidx-navigation" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# ktlint — CI gate style matches sdk/ and server/ (plugin is catalog-pinned;
# the ENGINE is pinned separately in composeApp/build.gradle.kts at 1.5.0 and
# deliberately does not move with the plugin).
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.2.0" }
