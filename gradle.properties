# Gradle properties for the accounting platform

# JVM heap size
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Android build type
android.debug.obfuscationMapping=false
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.caching=true

# Desktop packaging
compose.desktop浏阳 packaging.nativeImage = true

# macOS signing (Mac Developer ID for notarization)
compose.desktop.mac.signing.server = Developer ID Application
compose.desktop.mac.signing.identity = Developer ID Application
compose.desktop.mac.identity = Developer ID Application
compose.desktop.mac.hardenedRuntime = true
compose.desktop.mac.architectures = universal

# iOS signing (Apple Developer ID)
compose.ios.archiveResultingOfIntegration = false
compose.ios.signing.disableDevelopmentProfile = false
