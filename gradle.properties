# Gradle properties for the Tanvrit Accounting platform app.

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9.x + kotlin-multiplatform plugin compatibility (same pair platforms/ai
# carries): keep the legacy KMP-android wiring until the
# com.android.kotlin.multiplatform.library migration.
android.builtInKotlin=false
android.newDsl=false

# Compose Desktop packaging
compose.desktop.packaging.checkJdkVendor=false

# App identity (read by composeApp/build.gradle.kts; never edit casually —
# VERSION_CODE must strictly increase for any published Android build).
VERSION_NAME=1.0.0
VERSION_CODE=1

# SDK version this app is built against — kept for the Settings "about" surface
# (BuildIdentity). Tracks `tanvrit` in gradle/libs.versions.toml.
TANVRIT_SDK_VERSION=3.0.7
